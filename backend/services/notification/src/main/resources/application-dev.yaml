server:
  port: 8084

spring:
  application:
    name: notification-service
  output:
    ansi:
      enabled: always

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptex_notification}
    username: ${DB_USERNAME:cryptex}
    password: ${DB_PASSWORD:db@pass}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftlh
    charset: UTF-8
    check-template-location: true
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:prajapatibrajesh003@gmail.com}
    password: ${MAIL_PASSWORD:wkbkdhkzbtjyowiu}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

notification:
  email:
    from: ${MAIL_FROM:notifications@cryptex.com} # use this email to send
    reply-to: ${MAIL_REPLY_TO:support@cryptex.com} # accept replies on this email

logging:
  level:
    org.springframework.security: DEBUG

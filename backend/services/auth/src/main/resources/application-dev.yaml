server:
  port: 8081

spring:
  application:
    name: auth-service
  output:
    ansi:
      enabled: always

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptex_auth}
    username: ${DB_USERNAME:cryptex}
    password: ${DB_PASSWORD:db@pass}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true


jwt:
  secret: ${JWT_SECRET:thisIsMyVeryLongJwtSecretKeyForCryptexDevelopment123456789}
  access-expiration: ${JWT_ACCESS_EXPIRATION:15m} # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:7d} # 7 days


logging:
  level:
    org.springframework.security: DEBUG

server:
  port: 8081

spring:
  application:
    name: auth-service
  output:
    ansi:
      enabled: always

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptex_auth}
    username: ${DB_USERNAME:cryptex}
    password: ${DB_PASSWORD:db@pass}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG
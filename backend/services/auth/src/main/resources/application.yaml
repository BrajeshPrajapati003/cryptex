server:
  port: 8082

spring:
  application:
    name: auth-service
  output:
    ansi:
      enabled: always
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cryptex_auth}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: true

    properties:
      hibernate:
        format_sql: true


jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 15 minutes
  refresh-expiration: ${JWT_REFRESH_EXPIRATION} # 7 days


logging:
  level:
    org.springframework.security: DEBUG
